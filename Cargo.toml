[workspace]
resolver = "2"
members = [
    "crates/codex",
    "crates/emulator",
    "crates/kokoro",
    "crates/desktop",
    "crates/omote",
    "crates/website",
    "crates/mobile",
    "xtask",
]

[workspace.package]
version = "26.10.2"
edition = "2024"
license-file = "LICENSE"
authors = ["omochikaeri15 <251449262+omochikaeri15@users.noreply.github.com>"]
repository = "https://github.com/omochikaeri15/battle-cats-complete"

[workspace.dependencies]
codex = { path = "crates/codex" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.dev.package.emulator]
opt-level = 2

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.diagnose]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 16

[profile.diagnose.package."*"]
opt-level = "z"
