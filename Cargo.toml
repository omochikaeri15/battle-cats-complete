[workspace]
resolver = "2"
members = [
    "data",
    "emu",
    "kore",
    "gui",
    "xtask",
]

[workspace.package]
version = "4.2.2"
edition = "2024"
license-file = "LICENSE"
authors = ["omochikaeri15 <251449262+omochikaeri15@users.noreply.github.com>"]
repository = "https://github.com/omochikaeri15/battle-cats-complete"

[workspace.dependencies]
nyanko = { path = "data" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.dev.package.emu]
opt-level = 2

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"