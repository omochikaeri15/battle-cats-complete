name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: "Battle Cats Complete"

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      app_version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from root Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep "^version" Cargo.toml | head -1 | awk -F '"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if tag exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Version $TAG already exists."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Version $TAG is new! Preparing release..."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Build Windows (x64)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release (GUI)
        run: cargo build -p gui --release --verbose

      - name: Rename and Zip (Windows)
        run: |
          move target\release\gui.exe "${{ env.BIN_NAME }}.exe"
          Compress-Archive -Path "${{ env.BIN_NAME }}.exe" -DestinationPath bcc_windows_x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: bcc_windows_x64.zip
          retention-days: 1

  build-linux:
    name: Build Linux (${{ matrix.flavor }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - flavor: x64
            runner: ubuntu-22.04
            asset: bcc_linux_x64.zip
          - flavor: arm
            runner: ubuntu-22.04-arm
            asset: bcc_linux_arm.zip
    steps:
      - uses: actions/checkout@v5

      - name: Install audio headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release (GUI)
        run: cargo build -p gui --release --verbose

      - name: Prepare and Zip (Linux)
        run: |
          mv target/release/gui "${{ env.BIN_NAME }}"
          chmod +x "${{ env.BIN_NAME }}"
          zip "${{ matrix.asset }}" "${{ env.BIN_NAME }}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.flavor }}-build
          path: ${{ matrix.asset }}
          retention-days: 1

  build-macos:
    name: Build MacOS (${{ matrix.flavor }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - flavor: arm
            target: aarch64-apple-darwin
          - flavor: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release (GUI)
        run: cargo build -p gui --release --verbose --target ${{ matrix.target }}

      - name: Prepare and Zip (Mac)
        run: |
          mv "target/${{ matrix.target }}/release/gui" "${{ env.BIN_NAME }}"
          chmod +x "${{ env.BIN_NAME }}"
          zip "bcc_mac_${{ matrix.flavor }}.zip" "${{ env.BIN_NAME }}"

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.flavor }}-build
          path: bcc_mac_${{ matrix.flavor }}.zip
          retention-days: 1

  create-release:
    name: Publish Release
    needs: [check-version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4

      - name: List artifacts (Verification)
        run: ls -R

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          gh release create "v${{ needs.check-version.outputs.app_version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.check-version.outputs.app_version }}" \
            --notes-file CHANGELOG.md \
            windows-x64-build/bcc_windows_x64.zip \
            linux-x64-build/bcc_linux_x64.zip \
            linux-arm-build/bcc_linux_arm.zip \
            mac-arm-build/bcc_mac_arm.zip \
            mac-x64-build/bcc_mac_x64.zip
