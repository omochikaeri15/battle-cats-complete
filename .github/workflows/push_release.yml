name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: "Battle Cats Complete"

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      app_version: ${{ steps.get_version.outputs.version }}
      desktop: ${{ steps.builds.outputs.desktop }}
      website: ${{ steps.builds.outputs.website }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from root Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep "^version" Cargo.toml | head -1 | awk -F '"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Check if tag exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Version $TAG already exists."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Version $TAG is new! Preparing release..."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Pick the front ends this release builds
        id: builds
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          for NAME in desktop website; do
            if [ ! -f .github/release-builds ] && [ "$NAME" = desktop ]; then
              BUILD=true
            elif grep -q "^$NAME $VERSION " .github/release-builds 2>/dev/null; then
              BUILD=true
            else
              BUILD=false
            fi
            echo "$NAME=$BUILD" >> $GITHUB_OUTPUT
            echo "$NAME builds in v$VERSION: $BUILD"
          done

  build-windows:
    name: Build Windows (x64)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release (GUI)
        run: cargo build -p desktop --release --verbose

      - name: Rename and Zip (Windows)
        run: |
          move target\release\desktop.exe "${{ env.BIN_NAME }}.exe"
          Compress-Archive -Path "${{ env.BIN_NAME }}.exe" -DestinationPath bcc_windows_x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: bcc_windows_x64.zip
          retention-days: 1

  build-linux:
    name: Build Linux (${{ matrix.flavor }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - flavor: x64
            runner: ubuntu-22.04
            asset: bcc_linux_x64.zip
          - flavor: arm
            runner: ubuntu-22.04-arm
            asset: bcc_linux_arm.zip
    steps:
      - uses: actions/checkout@v5

      - name: Install audio headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release (GUI)
        run: cargo build -p desktop --release --verbose

      - name: Prepare and Zip (Linux)
        run: |
          mv target/release/desktop "${{ env.BIN_NAME }}"
          chmod +x "${{ env.BIN_NAME }}"
          zip "${{ matrix.asset }}" "${{ env.BIN_NAME }}"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.flavor }}-build
          path: ${{ matrix.asset }}
          retention-days: 1

  build-macos:
    name: Build MacOS (${{ matrix.flavor }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.desktop == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - flavor: arm
            target: aarch64-apple-darwin
          - flavor: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release (GUI)
        run: cargo build -p desktop --release --verbose --target ${{ matrix.target }}

      - name: Prepare and Zip (Mac)
        run: |
          mv "target/${{ matrix.target }}/release/desktop" "${{ env.BIN_NAME }}"
          chmod +x "${{ env.BIN_NAME }}"
          zip "bcc_mac_${{ matrix.flavor }}.zip" "${{ env.BIN_NAME }}"

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.flavor }}-build
          path: bcc_mac_${{ matrix.flavor }}.zip
          retention-days: 1

  build-website:
    name: Build & Deploy Website
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' && needs.check-version.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-website-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install the Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --locked --no-confirm

      - name: Clear the previous website bundle
        run: rm -rf target/dx/website/release/web/public

      - name: Build Website (release)
        working-directory: crates/website
        env:
          RUSTFLAGS: -C target-feature=+simd128
        run: dx build --release

      - name: Zip the WASM
        run: |
          WASM=$(find target/dx/website/release/web/public -name '*.wasm' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$WASM" ]; then
            echo "The website build produced no .wasm file"
            exit 1
          fi
          mkdir -p wasm-bundle
          cp "$WASM" "wasm-bundle/${{ env.BIN_NAME }}.wasm"
          (cd wasm-bundle && zip ../bcc_website_wasm.zip "${{ env.BIN_NAME }}.wasm")

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-wasm-build
          path: bcc_website_wasm.zip
          retention-days: 1

      - name: Add the Pages headers file
        run: cp crates/website/_headers target/dx/website/release/web/public/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy target/dx/website/release/web/public --project-name=battle-cats-complete --branch=main --commit-dirty=true

  create-release:
    name: Publish Release
    needs: [check-version, build-windows, build-linux, build-macos, build-website]
    if: ${{ !cancelled() && needs.check-version.outputs.should_release == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        if: needs.check-version.outputs.desktop == 'true' || needs.check-version.outputs.website == 'true'

      - name: List artifacts (Verification)
        run: ls -R

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          ASSETS=()
          if [ "${{ needs.check-version.outputs.desktop }}" = true ]; then
            ASSETS+=(
              windows-x64-build/bcc_windows_x64.zip
              linux-x64-build/bcc_linux_x64.zip
              linux-arm-build/bcc_linux_arm.zip
              mac-arm-build/bcc_mac_arm.zip
              mac-x64-build/bcc_mac_x64.zip
            )
          fi
          if [ "${{ needs.check-version.outputs.website }}" = true ]; then
            ASSETS+=(website-wasm-build/bcc_website_wasm.zip)
          fi
          gh release create "v${{ needs.check-version.outputs.app_version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.check-version.outputs.app_version }}" \
            --notes-file CHANGELOG.md \
            "${ASSETS[@]}"
